name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Both APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      
      - name: Build User APK
        run: |
          mkdir -p b_user
          cd b_user
          
          flutter create --org com.xwxwx --project-name user_app --platforms=android . 2>&1 | tail -2
          
          rm -rf lib && mkdir -p lib
          cp ../lib/user.dart lib/main.dart
          cp ../pubspec.yaml pubspec.yaml
          cp ../google-services.json android/app/google-services.json
          
          cd android
          echo "=== android/ ==="
          ls -la
          echo "=== android/app/ ==="
          ls -la app/
          echo "=== manifest ==="
          ls -la app/src/main/
          
          SETTINGS=""
          if [ -f settings.gradle.kts ]; then SETTINGS="settings.gradle.kts"; fi
          if [ -f settings.gradle ]; then SETTINGS="settings.gradle"; fi
          
          APP_BUILD=""
          if [ -f app/build.gradle.kts ]; then APP_BUILD="app/build.gradle.kts"; fi
          if [ -f app/build.gradle ]; then APP_BUILD="app/build.gradle"; fi
          
          MANIFEST="app/src/main/AndroidManifest.xml"
          
          echo "SETTINGS=$SETTINGS"
          echo "APP_BUILD=$APP_BUILD"
          echo "MANIFEST=$MANIFEST"
          
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Manifest not found!"
            find . -name "AndroidManifest.xml"
            exit 1
          fi
          
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/com\.xwxwx\.user_app/com.xwxwx.app/g' {} \;
          
          if ! grep -q "com.google.gms.google-services" "$SETTINGS"; then
            if [[ "$SETTINGS" == *.kts ]]; then
              sed -i 's|id("org.jetbrains.kotlin.android") version|id("com.google.gms.google-services") version "4.4.2" apply false\n    id("org.jetbrains.kotlin.android") version|' "$SETTINGS"
            else
              sed -i "s|id 'org.jetbrains.kotlin.android' version|id 'com.google.gms.google-services' version '4.4.2' apply false\n    id 'org.jetbrains.kotlin.android' version|" "$SETTINGS"
            fi
          fi
          
          if ! grep -q "com.google.gms.google-services" "$APP_BUILD"; then
            if [[ "$APP_BUILD" == *.kts ]]; then
              sed -i 's|id("dev.flutter.flutter-gradle-plugin")|id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")|' "$APP_BUILD"
            else
              sed -i "s|apply plugin: 'com.android.application'|apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'|" "$APP_BUILD"
            fi
          fi
          
          OLD_DIR="app/src/main/kotlin/com/xwxwx/user_app"
          NEW_DIR="app/src/main/kotlin/com/xwxwx/app"
          if [ -d "$OLD_DIR" ]; then
            mkdir -p "$NEW_DIR"
            if [ -f "$OLD_DIR/MainActivity.kt" ]; then
              mv "$OLD_DIR/MainActivity.kt" "$NEW_DIR/MainActivity.kt"
            fi
            rm -rf "$OLD_DIR"
          fi
          
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi
          sed -i 's|android:label="user_app"|android:label="XWXWX"|' "$MANIFEST"
          
          echo "=== After edits ==="
          grep "google-services" "$SETTINGS" || true
          grep "google-services" "$APP_BUILD" || true
          grep "INTERNET" "$MANIFEST" || true
          
          cd ..
          flutter clean
          flutter pub get
          flutter build apk --release
          
          cd ..
          cp b_user/build/app/outputs/flutter-apk/app-release.apk XWXWX-User.apk
          ls -la XWXWX-User.apk
      
      - name: Build Admin APK
        run: |
          mkdir -p b_admin
          cd b_admin
          
          flutter create --org com.xwxwx --project-name admin_app --platforms=android . 2>&1 | tail -2
          
          rm -rf lib && mkdir -p lib
          cp ../lib/admin.dart lib/main.dart
          cp ../pubspec.yaml pubspec.yaml
          cp ../google-services-admin.json android/app/google-services.json
          
          cd android
          
          SETTINGS=""
          if [ -f settings.gradle.kts ]; then SETTINGS="settings.gradle.kts"; fi
          if [ -f settings.gradle ]; then SETTINGS="settings.gradle"; fi
          
          APP_BUILD=""
          if [ -f app/build.gradle.kts ]; then APP_BUILD="app/build.gradle.kts"; fi
          if [ -f app/build.gradle ]; then APP_BUILD="app/build.gradle"; fi
          
          MANIFEST="app/src/main/AndroidManifest.xml"
          
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Manifest not found!"
            find . -name "AndroidManifest.xml"
            exit 1
          fi
          
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/com\.xwxwx\.admin_app/com.xwxwx.admin/g' {} \;
          
          if ! grep -q "com.google.gms.google-services" "$SETTINGS"; then
            if [[ "$SETTINGS" == *.kts ]]; then
              sed -i 's|id("org.jetbrains.kotlin.android") version|id("com.google.gms.google-services") version "4.4.2" apply false\n    id("org.jetbrains.kotlin.android") version|' "$SETTINGS"
            else
              sed -i "s|id 'org.jetbrains.kotlin.android' version|id 'com.google.gms.google-services' version '4.4.2' apply false\n    id 'org.jetbrains.kotlin.android' version|" "$SETTINGS"
            fi
          fi
          
          if ! grep -q "com.google.gms.google-services" "$APP_BUILD"; then
            if [[ "$APP_BUILD" == *.kts ]]; then
              sed -i 's|id("dev.flutter.flutter-gradle-plugin")|id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")|' "$APP_BUILD"
            else
              sed -i "s|apply plugin: 'com.android.application'|apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'|" "$APP_BUILD"
            fi
          fi
          
          OLD_DIR="app/src/main/kotlin/com/xwxwx/admin_app"
          NEW_DIR="app/src/main/kotlin/com/xwxwx/admin"
          if [ -d "$OLD_DIR" ]; then
            mkdir -p "$NEW_DIR"
            if [ -f "$OLD_DIR/MainActivity.kt" ]; then
              mv "$OLD_DIR/MainActivity.kt" "$NEW_DIR/MainActivity.kt"
            fi
            rm -rf "$OLD_DIR"
          fi
          
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi
          sed -i 's|android:label="admin_app"|android:label="XWXWX Admin"|' "$MANIFEST"
          
          cd ..
          flutter clean
          flutter pub get
          flutter build apk --release
          
          cd ..
          cp b_admin/build/app/outputs/flutter-apk/app-release.apk XWXWX-Admin.apk
          ls -la XWXWX-Admin.apk
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: |
            XWXWX-User.apk
            XWXWX-Admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
