name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_user:
    name: Build User APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true
      - name: Pre-install NDK
        run: |
          NDK_VERSION="27.0.12077973"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            mkdir -p "$ANDROID_HOME/ndk"
            cd /tmp
            for i in 1 2 3; do
              echo "--- Download attempt $i ---"
              if curl -fL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r27-linux.zip"; then
                break
              fi
              sleep 5
            done
            unzip -q ndk.zip
            mv android-ndk-r27 "$NDK_DIR"
          fi
          echo "NDK installed at: $NDK_DIR"
          ls -la "$ANDROID_HOME/ndk/"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
      - name: Build
        run: |
          mkdir -p b_user && cd b_user
          flutter create --org com.xwxwx --project-name user_app --platforms=android . 2>&1 | tail -3
          rm -rf lib && mkdir -p lib
          cp ../lib/user.dart lib/main.dart
          cp ../lib/firebase_options.dart lib/firebase_options.dart
          cp ../pubspec.yaml pubspec.yaml
          cd android
          NDK_VERSION="27.0.12077973"
          for f in settings.gradle settings.gradle.kts build.gradle build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's|org.jetbrains.kotlin.android" version ".*"|org.jetbrains.kotlin.android" version "2.0.21"|g' "$f"
              sed -i "s|org.jetbrains.kotlin.android' version '.*'|org.jetbrains.kotlin.android' version '2.0.21'|g" "$f"
              sed -i "s|ext.kotlin_version = .*|ext.kotlin_version = '2.0.21'|g" "$f"
            fi
          done
          if [ -f app/build.gradle.kts ]; then
            if grep -q "ndkVersion" app/build.gradle.kts; then
              sed -i "s|ndkVersion = .*|ndkVersion = \"$NDK_VERSION\"|" app/build.gradle.kts
            else
              sed -i "s|android {|android {\n    ndkVersion = \"$NDK_VERSION\"|" app/build.gradle.kts
            fi
          fi
          if [ -f app/build.gradle ]; then
            if grep -q "ndkVersion" app/build.gradle; then
              sed -i "s|ndkVersion .*|ndkVersion \"$NDK_VERSION\"|" app/build.gradle
            else
              sed -i "s|android {|android {\n    ndkVersion \"$NDK_VERSION\"|" app/build.gradle
            fi
          fi
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/com\.xwxwx\.user_app/com.xwxwx.app/g' {} \;
          OLD="app/src/main/kotlin/com/xwxwx/user_app"
          NEW="app/src/main/kotlin/com/xwxwx/app"
          if [ -d "$OLD" ]; then
            mkdir -p "$NEW"
            [ -f "$OLD/MainActivity.kt" ] && mv "$OLD/MainActivity.kt" "$NEW/"
            rm -rf "$OLD"
          fi
          MANIFEST="app/src/main/AndroidManifest.xml"
          grep -q "android.permission.INTERNET" "$MANIFEST" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          grep -q "READ_MEDIA_IMAGES" "$MANIFEST" || sed -i 's|<application|<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application|' "$MANIFEST"
          sed -i 's|android:label="user_app"|android:label="XWXWX"|' "$MANIFEST"
          cd ..
          flutter pub get
          flutter build apk --release
          cd ..
          cp b_user/build/app/outputs/flutter-apk/app-release.apk XWXWX-User.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XWXWX-User-apk
          path: XWXWX-User.apk

  build_admin:
    name: Build Admin APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true
      - name: Pre-install NDK
        run: |
          NDK_VERSION="27.0.12077973"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            mkdir -p "$ANDROID_HOME/ndk"
            cd /tmp
            for i in 1 2 3; do
              echo "--- Download attempt $i ---"
              if curl -fL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r27-linux.zip"; then
                break
              fi
              sleep 5
            done
            unzip -q ndk.zip
            mv android-ndk-r27 "$NDK_DIR"
          fi
          echo "NDK installed at: $NDK_DIR"
          ls -la "$ANDROID_HOME/ndk/"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
      - name: Build
        run: |
          mkdir -p b_admin && cd b_admin
          flutter create --org com.xwxwx --project-name admin_app --platforms=android . 2>&1 | tail -3
          rm -rf lib && mkdir -p lib
          cp ../lib/admin.dart lib/main.dart
          cp ../lib/firebase_options.dart lib/firebase_options.dart
          cp ../pubspec.yaml pubspec.yaml
          cd android
          NDK_VERSION="27.0.12077973"
          for f in settings.gradle settings.gradle.kts build.gradle build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's|org.jetbrains.kotlin.android" version ".*"|org.jetbrains.kotlin.android" version "2.0.21"|g' "$f"
              sed -i "s|org.jetbrains.kotlin.android' version '.*'|org.jetbrains.kotlin.android' version '2.0.21'|g" "$f"
              sed -i "s|ext.kotlin_version = .*|ext.kotlin_version = '2.0.21'|g" "$f"
            fi
          done
          if [ -f app/build.gradle.kts ]; then
            if grep -q "ndkVersion" app/build.gradle.kts; then
              sed -i "s|ndkVersion = .*|ndkVersion = \"$NDK_VERSION\"|" app/build.gradle.kts
            else
              sed -i "s|android {|android {\n    ndkVersion = \"$NDK_VERSION\"|" app/build.gradle.kts
            fi
          fi
          if [ -f app/build.gradle ]; then
            if grep -q "ndkVersion" app/build.gradle; then
              sed -i "s|ndkVersion .*|ndkVersion \"$NDK_VERSION\"|" app/build.gradle
            else
              sed -i "s|android {|android {\n    ndkVersion \"$NDK_VERSION\"|" app/build.gradle
            fi
          fi
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/com\.xwxwx\.admin_app/com.xwxwx.admin/g' {} \;
          OLD="app/src/main/kotlin/com/xwxwx/admin_app"
          NEW="app/src/main/kotlin/com/xwxwx/admin"
          if [ -d "$OLD" ]; then
            mkdir -p "$NEW"
            [ -f "$OLD/MainActivity.kt" ] && mv "$OLD/MainActivity.kt" "$NEW/"
            rm -rf "$OLD"
          fi
          MANIFEST="app/src/main/AndroidManifest.xml"
          grep -q "android.permission.INTERNET" "$MANIFEST" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          sed -i 's|android:label="admin_app"|android:label="XWXWX Admin"|' "$MANIFEST"
          cd ..
          flutter pub get
          flutter build apk --release
          cd ..
          cp b_admin/build/app/outputs/flutter-apk/app-release.apk XWXWX-Admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XWXWX-Admin-apk
          path: XWXWX-Admin.apk

  release:
    name: Create Release
    needs: [build_user, build_admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XWXWX-User-apk
      - uses: actions/download-artifact@v4
        with:
          name: XWXWX-Admin-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: |
            XWXWX-User.apk
            XWXWX-Admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
