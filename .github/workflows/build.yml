name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Both Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Build User App
        run: |
          mkdir -p user_build
          cd user_build
          flutter create --org com.xwxwx --project-name user_app --platforms=android .
          rm -rf lib
          mkdir -p lib
          cp ../lib/user.dart lib/main.dart
          cp ../pubspec.yaml pubspec.yaml
          cp ../google-services.json android/app/google-services.json
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "MainActivity.kt" -o -name "*.xml" \) -exec sed -i 's/com\.xwxwx\.user_app/com.xwxwx.app/g' {} \;
          OLD_DIR="android/app/src/main/kotlin/com/xwxwx/user_app"
          NEW_DIR="android/app/src/main/kotlin/com/xwxwx/app"
          if [ -d "$OLD_DIR" ]; then
            mkdir -p "$NEW_DIR"
            mv "$OLD_DIR/MainActivity.kt" "$NEW_DIR/MainActivity.kt" 2>/dev/null || true
            rm -rf "$OLD_DIR"
          fi
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="user_app"|android:label="XWXWX"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|id("org.jetbrains.kotlin.android") version|id("com.google.gms.google-services") version "4.4.2" apply false\n    id("org.jetbrains.kotlin.android") version|' android/settings.gradle.kts
          sed -i 's|id("dev.flutter.flutter-gradle-plugin")|id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")|' android/app/build.gradle.kts
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../XWXWX-User.apk

      - name: Build Admin App
        run: |
          mkdir -p admin_build
          cd admin_build
          flutter create --org com.xwxwx --project-name admin_app --platforms=android .
          rm -rf lib
          mkdir -p lib
          cp ../lib/admin.dart lib/main.dart
          cp ../pubspec.yaml pubspec.yaml
          cp ../google-services-admin.json android/app/google-services.json
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "MainActivity.kt" -o -name "*.xml" \) -exec sed -i 's/com\.xwxwx\.admin_app/com.xwxwx.admin/g' {} \;
          OLD_DIR="android/app/src/main/kotlin/com/xwxwx/admin_app"
          NEW_DIR="android/app/src/main/kotlin/com/xwxwx/admin"
          if [ -d "$OLD_DIR" ]; then
            mkdir -p "$NEW_DIR"
            mv "$OLD_DIR/MainActivity.kt" "$NEW_DIR/MainActivity.kt" 2>/dev/null || true
            rm -rf "$OLD_DIR"
          fi
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="admin_app"|android:label="XWXWX Admin"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|id("org.jetbrains.kotlin.android") version|id("com.google.gms.google-services") version "4.4.2" apply false\n    id("org.jetbrains.kotlin.android") version|' android/settings.gradle.kts
          sed -i 's|id("dev.flutter.flutter-gradle-plugin")|id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")|' android/app/build.gradle.kts
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../XWXWX-Admin.apk

      - name: Verify APKs
        run: ls -la XWXWX-User.apk XWXWX-Admin.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: |
            XWXWX-User.apk
            XWXWX-Admin.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
