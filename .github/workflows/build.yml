name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  user:
    name: Build User APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      - name: Build User
        run: |
          flutter create --org com.xwxwx --project-name app user_app
          cd user_app
          rm -rf lib && mkdir lib
          cp ../lib/user.dart lib/main.dart
          cp ../lib/firebase_options.dart lib/firebase_options.dart
          cp ../pubspec.yaml pubspec.yaml
          cp ../google-services.json android/app/google-services.json
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="app"|android:label="XWXWX"|' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../XWXWX-User.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XWXWX-User
          path: XWXWX-User.apk

  admin:
    name: Build Admin APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      - name: Build Admin
        run: |
          flutter create --org com.xwxwx --project-name admin admin_app
          cd admin_app
          rm -rf lib && mkdir lib
          cp ../lib/admin.dart lib/main.dart
          cp ../lib/firebase_options.dart lib/firebase_options.dart
          cp ../pubspec.yaml pubspec.yaml
          cp ../google-services-admin.json android/app/google-services.json
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="admin"|android:label="XWXWX Admin"|' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../XWXWX-Admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XWXWX-Admin
          path: XWXWX-Admin.apk
