name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Both APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Build User APK
        run: |
          mkdir -p b_user
          cd b_user
          flutter create --org com.xwxwx --project-name user_app --platforms=android . 2>&1 | tail -2

          rm -rf lib
          mkdir -p lib
          cp ../lib/user.dart lib/main.dart
          cp ../lib/firebase_options.dart lib/firebase_options.dart
          cp ../pubspec.yaml pubspec.yaml

          cd android
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/com\.xwxwx\.user_app/com.xwxwx.app/g' {} \;

          OLD="app/src/main/kotlin/com/xwxwx/user_app"
          NEW="app/src/main/kotlin/com/xwxwx/app"
          if [ -d "$OLD" ]; then
            mkdir -p "$NEW"
            if [ -f "$OLD/MainActivity.kt" ]; then
              mv "$OLD/MainActivity.kt" "$NEW/MainActivity.kt"
            fi
            rm -rf "$OLD"
          fi

          MANIFEST="app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi
          if ! grep -q "READ_MEDIA_IMAGES" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <application|' "$MANIFEST"
          fi
          sed -i 's|android:label="user_app"|android:label="XWXWX"|' "$MANIFEST"

          cd ..
          flutter pub get
          flutter build apk --release

          cd ..
          cp b_user/build/app/outputs/flutter-apk/app-release.apk XWXWX-User.apk

      - name: Build Admin APK
        run: |
          mkdir -p b_admin
          cd b_admin
          flutter create --org com.xwxwx --project-name admin_app --platforms=android . 2>&1 | tail -2

          rm -rf lib
          mkdir -p lib
          cp ../lib/admin.dart lib/main.dart
          cp ../lib/firebase_options.dart lib/firebase_options.dart
          cp ../pubspec.yaml pubspec.yaml

          cd android
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/com\.xwxwx\.admin_app/com.xwxwx.admin/g' {} \;

          OLD="app/src/main/kotlin/com/xwxwx/admin_app"
          NEW="app/src/main/kotlin/com/xwxwx/admin"
          if [ -d "$OLD" ]; then
            mkdir -p "$NEW"
            if [ -f "$OLD/MainActivity.kt" ]; then
              mv "$OLD/MainActivity.kt" "$NEW/MainActivity.kt"
            fi
            rm -rf "$OLD"
          fi

          MANIFEST="app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi
          sed -i 's|android:label="admin_app"|android:label="XWXWX Admin"|' "$MANIFEST"

          cd ..
          flutter pub get
          flutter build apk --release

          cd ..
          cp b_admin/build/app/outputs/flutter-apk/app-release.apk XWXWX-Admin.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: |
            XWXWX-User.apk
            XWXWX-Admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
